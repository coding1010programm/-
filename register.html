<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Регистрация - NLG store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,217,102,0.2);
        }
        h1 { 
            color: #ffd966; 
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        .subtitle { 
            color: #aaa; 
            margin-bottom: 30px; 
            font-size: 0.85rem;
        }
        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
        }
        .tab {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }
        .tab.active {
            color: #ffd966;
            border-bottom: 2px solid #ffd966;
        }
        .form-group {
            margin-bottom: 22px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
            font-size: 0.85rem;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 30px;
            border: none;
            background: #2a2a3a;
            color: white;
            font-size: 0.95rem;
        }
        input:focus { 
            outline: none; 
            background: #3a3a4a;
            box-shadow: 0 0 0 2px #ffd966;
        }
        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffd966, #ffcd3c);
            border: none;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
            color: #1a1a1a;
        }
        button[type="submit"]:hover { 
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255,217,102,0.3);
        }
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 30px;
            font-size: 0.85rem;
            display: none;
        }
        .message.error { 
            background: rgba(255,68,68,0.2); 
            color: #ff8888; 
            display: block;
            border: 1px solid #ff4444;
        }
        .message.success { 
            background: rgba(76,175,80,0.2); 
            color: #8bc34a; 
            display: block;
            border: 1px solid #4caf50;
        }
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #ffd966;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .back-link:hover { opacity: 0.8; text-decoration: underline; }
    </style>
</head>
<body>
<div class="container">
    <h1>🛍️ NLG STORE</h1>
    <div class="subtitle">Войдите или зарегистрируйтесь</div>
    
    <div class="tabs">
        <button class="tab active" id="loginTab">🔐 Вход</button>
        <button class="tab" id="registerTab">📝 Регистрация</button>
    </div>
    
    <form id="loginForm">
        <div class="form-group">
            <label>👤 Логин</label>
            <input type="text" id="loginUsername" placeholder="login" required>
        </div>
        <div class="form-group">
            <label>🔒 Пароль</label>
            <input type="password" id="loginPassword" placeholder="password" required>
        </div>
        <button type="submit">Войти</button>
    </form>
    
    <form id="registerForm" style="display: none;">
        <div class="form-group">
            <label>👤 Логин</label>
            <input type="text" id="regUsername" placeholder="придумайте логин" required>
        </div>
        
        <div class="form-group">
            <label>🔒 Пароль</label>
            <input type="password" id="regPassword" placeholder="минимум 6 символов" required>
        </div>
        <div class="form-group">
            <label>🔁 Подтвердите пароль</label>
            <input type="password" id="regConfirmPassword" placeholder="повторите пароль" required>
        </div>
        <button type="submit">Зарегистрироваться</button>
    </form>
    
    <div id="message" class="message"></div>
    <a href="ГЛАВНАЯ СТРАНИЦА.html" class="back-link" id="backToShopLink">← Вернуться в магазин</a>
</div>

<script>
    // ДАННЫЕ ВЛАДЕЛЬЦА
    const OWNER = {
        username: "admin",
        password: "admin123"
    };
    
    const STORAGE_KEYS = {
        USER: 'nlg_user',
        USERS_LIST: 'nlg_users_list'
    };
    
    // Инициализация списка пользователей
    function initUsers() {
        const existing = localStorage.getItem(STORAGE_KEYS.USERS_LIST);
        if (!existing) {
            const defaultUsers = [
                {
                    id: 'owner_1',
                    username: OWNER.username,
                    email: 'admin@nlgstore.com',
                    password: OWNER.password,
                    isOwner: true
                }
            ];
            localStorage.setItem(STORAGE_KEYS.USERS_LIST, JSON.stringify(defaultUsers));
        }
    }
    
    function getUsers() {
        const users = localStorage.getItem(STORAGE_KEYS.USERS_LIST);
        return users ? JSON.parse(users) : [];
    }
    
    function saveUsers(users) {
        localStorage.setItem(STORAGE_KEYS.USERS_LIST, JSON.stringify(users));
    }
    
    function findUserByUsername(username) {
        const users = getUsers();
        return users.find(u => u.username.toLowerCase() === username.toLowerCase());
    }
    
    function findUserByEmail(email) {
        const users = getUsers();
        return users.find(u => u.email.toLowerCase() === email.toLowerCase());
    }
    
    function registerUser(username, email, password) {
        const users = getUsers();
        
        if (findUserByUsername(username)) {
            return { success: false, error: 'Логин уже занят' };
        }
        if (findUserByEmail(email)) {
            return { success: false, error: 'Email уже используется' };
        }
        if (username.toLowerCase() === OWNER.username.toLowerCase()) {
            return { success: false, error: 'Этот логин зарезервирован' };
        }
        
        const newUser = {
            id: 'user_' + Date.now(),
            username: username,
            email: email,
            password: password,
            isOwner: false
        };
        
        users.push(newUser);
        saveUsers(users);
        
        return { success: true, user: { id: newUser.id, username: newUser.username, email: newUser.email, isOwner: false } };
    }
    
    function loginUser(login, password) {
        const users = getUsers();
        const user = users.find(u => 
            (u.username === login || u.email === login) && u.password === password
        );
        
        if (user) {
            const userData = {
                id: user.id,
                username: user.username,
                email: user.email,
                isOwner: user.isOwner || false
            };
            localStorage.setItem(STORAGE_KEYS.USER, JSON.stringify(userData));
            return { success: true, user: userData };
        }
        return { success: false, error: 'Неверный логин или пароль' };
    }
    
    function showMessage(text, type) {
        const msg = document.getElementById('message');
        msg.className = `message ${type}`;
        msg.textContent = text;
        setTimeout(() => {
            msg.className = 'message';
            msg.style.display = 'none';
        }, 3000);
    }
    
    // Переключение табов
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    
    loginTab.onclick = () => {
        loginTab.classList.add('active');
        registerTab.classList.remove('active');
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        document.getElementById('message').className = 'message';
    };
    
    registerTab.onclick = () => {
        registerTab.classList.add('active');
        loginTab.classList.remove('active');
        registerForm.style.display = 'block';
        loginForm.style.display = 'none';
        document.getElementById('message').className = 'message';
    };
    
    // Вход
    loginForm.onsubmit = (e) => {
        e.preventDefault();
        const login = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        
        if (!login || !password) {
            showMessage('Заполните все поля', 'error');
            return;
        }
        
        const result = loginUser(login, password);
        
        if (result.success) {
            showMessage('Вход выполнен! Переход в магазин...', 'success');
            setTimeout(() => {
                window.location.href = 'ГЛАВНАЯ СТРАНИЦА.html';
            }, 1000);
        } else {
            showMessage(result.error, 'error');
        }
    };
    
    // Регистрация
    registerForm.onsubmit = (e) => {
        e.preventDefault();
        const username = document.getElementById('regUsername').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        const confirm = document.getElementById('regConfirmPassword').value.trim();
        
        if (!username || !email || !password || !confirm) {
            showMessage('Заполните все поля', 'error');
            return;
        }
        if (password.length < 6) {
            showMessage('Пароль должен быть минимум 6 символов', 'error');
            return;
        }
        if (password !== confirm) {
            showMessage('Пароли не совпадают', 'error');
            return;
        }
        if (!email.includes('@')) {
            showMessage('Введите корректный email', 'error');
            return;
        }
        
        const result = registerUser(username, email, password);
        
        if (result.success) {
            localStorage.setItem(STORAGE_KEYS.USER, JSON.stringify(result.user));
            showMessage('Регистрация успешна! Переход в магазин...', 'success');
            setTimeout(() => {
                window.location.href = 'ГЛАВНАЯ СТРАНИЦА.html';
            }, 1000);
        } else {
            showMessage(result.error, 'error');
        }
    };
    
    // Проверяем, если уже залогинены
    const currentUser = localStorage.getItem(STORAGE_KEYS.USER);
    if (currentUser) {
        try {
            const user = JSON.parse(currentUser);
            document.getElementById('backToShopLink').innerHTML = '🏠 Перейти в магазин (' + user.username + ')';
        } catch(e) {}
    }
    
    initUsers();
</script>
</body>
</html>
